  if (window.playablesSDK) return;

  var gameReadySent = false;
  var firstInteractionSent = false;
  var errorSent = false;
  var frameCount = 0;
  var originalRAF = window.requestAnimationFrame;

  // --- Transport Layer ---

  function hasIOSBridge() {

              window.webkit.messageHandlers &&
              window.webkit.messageHandlers[HANDLER_NAME]);

              typeof window[ANDROID_BRIDGE_NAME].postEvent === 'function');
  }

  }

      type: eventName,
      payload: payload || {},
      timestamp: Date.now()
    };

    if (hasIOSBridge()) {
      try {
        window.webkit.messageHandlers[HANDLER_NAME].postMessage(message);
      } catch (e) { /* ignore */ }

        eventName,
        JSON.stringify(p)
      );
    } catch (e) { /* ignore */ }

  }

      try {
        window.parent.postMessage(message, '*');
      } catch (e) { /* ignore */ }
      return;
    }
  }

  // --- rAF Game-Ready Detection ---

  function onFrame() {
    if (gameReadySent) return;

    frameCount++;
    if (frameCount >= RAF_FRAME_THRESHOLD) {
      gameReadySent = true;
      sendEvent('game_ready', {
        frame_count: frameCount,
        detected_at: Date.now()

  }

  if (originalRAF) {

      if (!gameReadySent) {

          frameCount++;
          if (frameCount >= RAF_FRAME_THRESHOLD && !gameReadySent) {
            gameReadySent = true;

              frame_count: frameCount,
              detected_at: Date.now()

  function setupFirstInteractionDetection() {

  // --- Auto Error Capture ---

  window.addEventListener('error', function(event) {

  window.playablesSDK = {
    complete: function(score) {

        score: score,
        completed: true

    },

    error: function(message) {
      if (errorSent) return;
      errorSent = true;

    sendEvent: function(eventName, payload) {

<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dodge Adventure V2</title>
<style>
:root{--bg:#02040a;--text:#e6eaf2;--muted:#8892b0;--accent:#6ee7ff}
*{box-sizing:border-box}
body{margin:0;background:#02040a;color:var(--text);font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif}
header,main{max-width:440px;margin:0 auto;padding:12px 16px}
.topbar{display:flex;justify-content:space-between;align-items:center}
.hud{display:flex;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:14px}
.hud strong{color:var(--text)}
canvas{width:100%;height:auto;background:linear-gradient(180deg,#0a1a2e,#02040a);border:1px solid #1f2542;border-radius:12px;display:block}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.78);z-index:10}
.card{background:#14182b;border:1px solid #2a335a;border-radius:12px;padding:20px;max-width:380px;width:92%;text-align:center}
.hidden{display:none}
button{background:linear-gradient(180deg,#2b335a,#202646);color:var(--text);border:1px solid #364075;border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer;margin:4px}
button:disabled{opacity:.5;cursor:not-allowed}
.badge{background:#1f2542;color:var(--accent);padding:4px 8px;border-radius:999px;font-size:12px}
.iconbtn{background:#1f2542;border:1px solid #364075;border-radius:8px;padding:6px 10px}
.shop-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.shop-item{background:#0f142a;border:1px solid #2a335a;border-radius:10px;padding:10px}
</style>
</head>
<body>
<header>
<div class="topbar">
<h2>Aventura <span class="badge" id="phaseBadge">Fase 1</span></h2>
<div>
<button class="iconbtn" id="pauseBtn">⏸️</button>
<button class="iconbtn" id="shopBtn">🛒</button>
</div>
</div>
<div class="hud">
<span>Pontos: <strong id="score">0</strong></span>
<span>Recorde: <strong id="best">0</strong></span>
<span>Vidas: <strong id="lives">5</strong></span>
<span>Moedas: <strong id="coins">0</strong></span>
</div>
</header>
<main>
<canvas id="game" width="360" height="600"></canvas>
</main>

<div class="overlay" id="tutorial">
<div class="card">
<h2>Como Jogar</h2>
<p style="text-align:left">• Você é 🧍<br>• Desvie de 🌲 🌀 🐗<br>• Colete ⭐ 🛡️ ❤️<br>• Compre vida e escudo na loja</p>
<button id="startBtn">Começar</button>
</div>
</div>

<div class="overlay hidden" id="pauseMenu">
<div class="card">
<h2>Pausado</h2>
<button id="resumeBtn">Continuar</button>
<button id="shopFromPause">Loja</button>
<button id="restartBtn">Recomeçar</button>
</div>
</div>

<div class="overlay hidden" id="phaseComplete">
<div class="card">
<h2>Fase Concluída!</h2>
<p>+1 vida bônus</p>
<button id="nextPhaseBtn">Próxima Fase</button>
</div>
</div>

<div class="overlay hidden" id="gameover">
<div class="card">
<h2>Game Over</h2>
<p>Pontuação: <strong id="finalScore">0</strong></p>
<button id="retryBtn">Tentar Novamente</button>
</div>
</div>

<div class="overlay hidden" id="shop">
<div class="card">
<h2>Loja</h2>
<div class="shop-grid" id="shopGrid"></div>
<button id="closeShop">Fechar</button>
</div>
</div>

<script>
(() => {
const canvas=document.getElementById('game'), ctx=canvas.getContext('2d');
const scoreEl=document.getElementById('score'), bestEl=document.getElementById('best'), livesEl=document.getElementById('lives'), coinsEl=document.getElementById('coins'), phaseBadge=document.getElementById('phaseBadge');
const tutorial=document.getElementById('tutorial'), pauseMenu=document.getElementById('pauseMenu'), phaseComplete=document.getElementById('phaseComplete'), gameover=document.getElementById('gameover'), shop=document.getElementById('shop');
const finalScoreEl=document.getElementById('finalScore');

document.getElementById('startBtn').onclick=start;
document.getElementById('pauseBtn').onclick=pause;
document.getElementById('resumeBtn').onclick=resume;
document.getElementById('restartBtn').onclick=()=>{pauseMenu.classList.add('hidden');start();};
document.getElementById('retryBtn').onclick=()=>{gameover.classList.add('hidden');start();};
document.getElementById('shopBtn').onclick=openShop;
document.getElementById('shopFromPause').onclick=()=>{pauseMenu.classList.add('hidden');openShop();};
document.getElementById('closeShop').onclick=()=>{shop.classList.add('hidden'); if(state.paused) pauseMenu.classList.remove('hidden'); };
document.getElementById('nextPhaseBtn').onclick=nextPhase;

function setup(){const w=canvas.clientWidth||360; const h=Math.round(w*600/360); canvas.style.height=h+'px'; const dpr=Math.min(devicePixelRatio||1,2); canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr); ctx.setTransform(dpr,0,0,dpr,0,0);}
setup(); addEventListener('resize',setup);

const save={coins:+localStorage.getItem('db_coins')||0};
function updateCoinsUI(){coinsEl.textContent=save.coins;}
updateCoinsUI();

const state={running:false,paused:false,score:0,best:+localStorage.getItem('db_best')||0,lives:5,phase:1,phaseTarget:1000,player:{x:156,y:500,w:48,h:60,targetX:156,trail:[]},obstacles:[],powerups:[],t:0,speed:2.2,spawnEvery:60,shield:0,invuln:0};
bestEl.textContent=state.best;

addEventListener('keydown',e=>{if(e.key==='ArrowLeft')state.player.targetX-=45;if(e.key==='ArrowRight')state.player.targetX+=45;});
canvas.addEventListener('pointerdown',e=>{const r=canvas.getBoundingClientRect();state.player.targetX=e.clientX-r.left-24;});
canvas.addEventListener('pointermove',e=>{if(e.pressure===0)return;const r=canvas.getBoundingClientRect();state.player.targetX=e.clientX-r.left-24;});

function start(){
 Object.assign(state,{running:true,paused:false,score:0,lives:5,phase:1,phaseTarget:1000,obstacles:[],powerups:[],t:0,speed:2.2,spawnEvery:60,shield:0,invuln:0,player:{x:156,y:500,w:48,h:60,targetX:156,trail:[]}});
 tutorial.classList.add('hidden'); pauseMenu.classList.add('hidden'); phaseComplete.classList.add('hidden'); gameover.classList.add('hidden'); shop.classList.add('hidden');
 phaseBadge.textContent='Fase 1';
 loop();
}
function pause(){if(!state.running) return; state.running=false; state.paused=true; pauseMenu.classList.remove('hidden');}
function resume(){pauseMenu.classList.add('hidden'); state.running=true; state.paused=false; loop();}
function openShop(){shop.classList.remove('hidden'); renderShop();}

function rand(a,b){return Math.random()*(b-a)+a}
function rectOverlap(a,b){return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;}

const obstacleTypes=[{emoji:'🌲',w:50,h:60},{emoji:'🌀',w:48,h:48},{emoji:'🐗',w:56,h:44}];

function spawn(){
 const w=canvas.clientWidth;
 // garante obstáculo mesmo no meio: 70% chance de spawn perto do jogador
 const nearPlayer = Math.random()<0.7;
 let x;
 if(nearPlayer){
  x = Math.max(0, Math.min(w-60, state.player.x + rand(-80,80)));
 }else{
  x = rand(0,w-60);
 }
 const type=obstacleTypes[Math.floor(Math.random()*obstacleTypes.length)];
 state.obstacles.push({x,y:-70,w:type.w,h:type.h,vy:state.speed+rand(0,0.6),emoji:type.emoji});
 // powerups
 if(Math.random()<0.6){
  const types=['coin','shield','life'];
  const tp=types[Math.floor(Math.random()*types.length)];
  state.powerups.push({x:rand(30,w-30),y:-30,r:18,vy:1.9,type:tp});
 }
}

function loop(){
 if(!state.running) return;
 state.t++;
 if(state.shield>0)state.shield--;
 if(state.invuln>0)state.invuln--;

 if(state.t % state.spawnEvery ===0) spawn();

 state.player.x += (state.player.targetX - state.player.x)*0.25;
 state.player.x = Math.max(0, Math.min(canvas.clientWidth-state.player.w, state.player.x));
 state.player.trail.push({x:state.player.x,y:state.player.y,life:12});
 if(state.player.trail.length>12) state.player.trail.shift();

 state.obstacles.forEach(o=>o.y+=o.vy);
 state.obstacles=state.obstacles.filter(o=>o.y<canvas.clientHeight+80);
 state.powerups.forEach(p=>p.y+=p.vy);
 state.powerups=state.powerups.filter(p=>p.y<canvas.clientHeight+30);

 const pRect={x:state.player.x+8,y:state.player.y+10,w:state.player.w-16,h:state.player.h-10};
 for(const o of [...state.obstacles]){
  if(rectOverlap(pRect,{x:o.x,y:o.y,w:o.w,h:o.h}) && state.invuln===0){
   if(state.shield>0){state.shield=0; state.invuln=50; state.obstacles=state.obstacles.filter(x=>x!==o); break;}
   state.lives--; state.score=Math.max(0,state.score-50); state.invuln=70;
   state.obstacles=state.obstacles.filter(x=>x!==o);
   if(state.lives<=0){gameOver(); return;}
   break;
  }
 }
 for(const pu of [...state.powerups]){
  if(Math.hypot(pu.x-(state.player.x+24), pu.y-(state.player.y+30))<38){
   if(pu.type==='coin'){save.coins+=3; localStorage.setItem('db_coins',save.coins); updateCoinsUI();}
   if(pu.type==='shield') state.shield=500;
   if(pu.type==='life') state.lives++;
   state.powerups=state.powerups.filter(x=>x!==pu);
  }
 }

 state.score++;
 if(state.score>=state.phaseTarget){
  state.running=false;
  phaseComplete.classList.remove('hidden');
  return;
 }

 scoreEl.textContent=state.score;
 livesEl.textContent=state.lives;
 draw();
 requestAnimationFrame(loop);
}

function nextPhase(){
 state.phase++; state.lives++; state.phaseTarget+=900; state.speed+=0.25;
 phaseBadge.textContent='Fase '+state.phase;
 phaseComplete.classList.add('hidden');
 state.running=true;
 loop();
}

function draw(){
 const w=canvas.clientWidth,h=canvas.clientHeight;
 const g=ctx.createLinearGradient(0,0,0,h); g.addColorStop(0,'#0a2a1a'); g.addColorStop(1,'#02040a'); ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
 ctx.fillStyle='#0d2818'; ctx.fillRect(0,h-40,w,40);
 // trail
 state.player.trail.forEach(t=>{ctx.globalAlpha=t.life/12*0.25; ctx.font='32px serif'; ctx.fillText('🧍',t.x+8,t.y+45);}); ctx.globalAlpha=1;
 // obstacles
 ctx.font='44px serif'; ctx.textAlign='center';
 state.obstacles.forEach(o=>{ctx.fillText(o.emoji,o.x+o.w/2,o.y+o.h);});
 // powerups
 state.powerups.forEach(p=>{
  ctx.font='28px serif';
  const e=p.type==='shield'?'🛡️':p.type==='life'?'❤️':'⭐';
  ctx.fillText(e,p.x,p.y);
 });
 // player
 ctx.font='48px serif';
 ctx.fillText('🧍',state.player.x+24,state.player.y+50);
 if(state.shield>0){ctx.strokeStyle='#6ee7ff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(state.player.x+24,state.player.y+30,36,0,Math.PI*2);ctx.stroke();}
}

function gameOver(){
 state.running=false; state.paused=false;
 finalScoreEl.textContent=state.score;
 if(state.score>state.best){state.best=state.score; localStorage.setItem('db_best',state.best); bestEl.textContent=state.best;}
 gameover.classList.remove('hidden');
}

function renderShop(){
 const grid=document.getElementById('shopGrid'); grid.innerHTML='';
 const items=[
  {name:'Vida +1',price:50,action:()=>{state.lives++; livesEl.textContent=state.lives;}},
  {name:'Escudo',price:30,action:()=>{state.shield=500;}},
  {name:'Moedas +20',price:0,action:()=>{save.coins+=20; localStorage.setItem('db_coins',save.coins); updateCoinsUI();}}
 ];
 items.forEach(it=>{
  const canBuy = save.coins >= it.price;
  const div=document.createElement('div'); div.className='shop-item';
  div.innerHTML=`<strong>${it.name}</strong><br><small>${it.price} moedas</small><br><button ${!canBuy?'disabled':''}>Comprar</button>`;
  div.querySelector('button').onclick=()=>{
   if(save.coins>=it.price){
    save.coins-=it.price; localStorage.setItem('db_coins',save.coins); updateCoinsUI();
    it.action();
    renderShop();
   }
  };
  grid.appendChild(div);
 });
}
})();
</script>
</body>
  </html>
